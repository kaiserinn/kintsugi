[package]
name = "kintsugi"
description = "An elegant CLI for managing and deploying your NixOS configurations, inspired by the art of mending with gold."
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kin"
path = "src/main.rs"

[dependencies]
chrono = "0.4.41"
clap = { version = "4.5.43", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.9.5"
